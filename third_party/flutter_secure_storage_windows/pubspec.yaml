name: flutter_secure_storage_windows
description: Local Windows override for flutter_secure_storage using DPAPI-backed Dart FFI storage.
version: 3.1.2
publish_to: 'none'

environment:
  sdk: ^3.11.1
  flutter: ">=3.32.0"

dependencies:
  ffi: ^2.0.0
  flutter:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^1.1.1
  path: ^1.8.0
  path_provider: ^2.0.0
  win32: ^5.15.0

flutter:
  plugin:
    implements: flutter_secure_storage
    platforms:
      windows:
        dartPluginClass: FlutterSecureStorageWindows
